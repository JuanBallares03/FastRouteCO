name: Bug report
description: Report something that does not work as the requirements define.
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: input
    id: traceability
    attributes:
      label: Traceability
      description: Requirement IDs the bug breaks (HU, RF, RNF, CU).
      placeholder: HU-12, RF05, RNF03, CU-20
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Backend
        - Web
        - Mobile
        - Docs
        - CI / infrastructure
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Production
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove tokens, keys and personal data before pasting.
      render: shell
