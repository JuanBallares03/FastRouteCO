<form class="space-y-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1" for="correo">
          Correo electrónico corporativo
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">
            mail
          </span>
<input class="w-full h-[42px] pl-10 pr-3 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all" id="correo" name="correo" placeholder="ejemplo@empresa.com.co" required="" type="email" value="despacho.central@ibague-logistica.com.co">
</div>
</div>
<div class="flex flex-col">
<div class="flex justify-between items-center mb-1">
<label class="font-label-md text-label-md text-on-surface" for="clave">
            Contraseña
          </label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">
            ¿Olvidaste tu contraseña?
          </a>
</div>

<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">

          </span>

</button>
</div>

<script>
  function alternarClave() {
    var campo = document.getElementById('clave');
    var icono = document.getElementById('icono-clave');
    if (campo.type === 'password') {
      campo.type = 'text';
      icono.textContent = 'visibility_off';
    } else {
      campo.type = 'password';
      icono.textContent = 'visibility';
    }
  }

  function seleccionarRol(rol) {
    var correos = {
      admin: 'admin.nacional@fastroute.com.co',
      cliente: 'gerencia.tolima@almacenesibague.com.co',
      supervisor: 'supervisor.reparto@logisticadeloriente.com.co'
    };

    var inputCorreo = document.getElementById('correo');
    if (inputCorreo && correos[rol]) {
      inputCorreo.value = correos[rol];
    }

    var roles = ['admin', 'cliente', 'supervisor'];
    roles.forEach(function(r) {
      var btn = document.getElementById('role-' + r);
      if (r === rol) {
        btn.className = 'flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md text-center transition-all bg-surface-container-lowest text-primary shadow-sm font-semibold';
      } else {
        btn.className = 'flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md text-center transition-all text-on-surface-variant hover:text-on-surface';
      }
    });
  }
</script></main>
